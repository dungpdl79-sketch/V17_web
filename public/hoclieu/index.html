<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vượt ải đơn điệu · Chương 1 Bài 1</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Be Vietnam Pro","Noto Sans",Arial,sans-serif;
       padding:8px;color:#14532d;text-rendering:optimizeLegibility}
</style>
</head>
<body>
<div class="dcg" id="dcg-root">
<style>
.dcg{--g-ink:#14532d;--g-deep:#166534;--g-line:#bbf7d0;--g-mint:#dcfce7;--g-grass:#16a34a;--g-warn:#b45309;--g-bad:#b91c1c;
  --g-vien:#16a34a;                    /* viền phần tử bấm được: 3,3:1 so với nền trắng */
  --fs:17px;                            /* cỡ chữ gốc, do hồ sơ thiết bị đặt */
  --cot:2;                              /* số cột phương án */
  --nut:2.7em;                          /* chiều cao tối thiểu vùng bấm */
  --rong:66ch;                          /* bề rộng dòng chữ tối đa khi đọc */
  color:var(--g-ink);font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
.dcg *{box-sizing:border-box}
.dcg-card{border:1px solid var(--g-line);border-radius:14px;background:#fff;overflow:hidden}
.dcg-top{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;justify-content:space-between;
  padding:.7em 1em;background:linear-gradient(180deg,#f0fdf4,#fff);border-bottom:1px solid var(--g-line)}
.dcg-brand{font-weight:800;letter-spacing:.01em;color:var(--g-ink)}
.dcg-brand span{display:block;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#15803d;opacity:.75}
.dcg-hud{display:flex;gap:.9em;align-items:center;font-variant-numeric:tabular-nums;font-size:.88rem;font-weight:700}
.dcg-hud b{font-weight:800}
.dcg-hearts{letter-spacing:.08em;color:#dc2626}
.dcg-hearts i{font-style:normal;opacity:.22}
.dcg-track{padding:.5em 1em 0}
.dcg-track svg{display:block;width:100%;height:56px}
.dcg-timebar{height:6px;background:#fee2e2}
.dcg-timebar i{display:block;height:100%;width:100%;background:#dc2626;transition:width .12s linear}
.dcg-timebar.low i{background:#991b1b}
.dcg-body{padding:1em}
.dcg-meta{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;margin-bottom:.55em}
.dcg-tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;padding:.16em .55em;border-radius:5px;background:var(--g-mint);color:#15803d}
.dcg-tag.ai{background:#fff;border:1px solid var(--g-line);color:var(--g-deep)}
.dcg-stem{margin:.2em 0 .7em;max-width:var(--rong)}
.dcg-fb p,.dcg-rev .noi{max-width:var(--rong)}
.dcg-stem p{margin:.35em 0}
.dcg-opts{display:grid;gap:.5em;grid-template-columns:repeat(var(--cot),minmax(0,1fr))}
@media(max-width:560px){.dcg-opts{grid-template-columns:1fr}}
.dcg-opt{display:flex;gap:.6em;align-items:center;width:100%;min-height:var(--nut);text-align:left;font:inherit;color:inherit;
  border:1px solid var(--g-vien);border-left:4px solid var(--g-grass);border-radius:9px;background:#fff;padding:.6em .8em;cursor:pointer}
.dcg-opt:hover:not(:disabled){background:#f0fdf4}
.dcg-opt:disabled{cursor:default}
.dcg-opt kbd{flex:0 0 auto;font:800 .8rem/1 inherit;background:var(--g-mint);color:#15803d;border-radius:4px;padding:.32em .45em}
.dcg-opt.ok{border-color:var(--g-grass);border-left-color:var(--g-grass);background:#f0fdf4}
.dcg-opt.no{border-color:#fecaca;border-left-color:var(--g-bad);background:#fef2f2}
.dcg-ds{display:grid;gap:.45em;margin:.2em 0 .8em}
.dcg-ds-row{display:flex;gap:.6em;align-items:center;border:1px solid var(--g-line);border-radius:9px;padding:.5em .7em;background:#fff}
.dcg-ds-row .t{flex:1}
.dcg-ds-row .k{font-weight:800;color:var(--g-deep);flex:0 0 1.2em}
.dcg-ds-row .btns{display:flex;gap:.3em;flex:0 0 auto}
.dcg-ds-row button{font:800 .9rem/1 inherit;border:1px solid var(--g-vien);background:#fff;color:var(--g-deep);
  border-radius:6px;width:var(--nut);height:var(--nut);cursor:pointer}
.dcg-ds-row button[aria-pressed="true"]{background:var(--g-deep);color:#fff;border-color:var(--g-deep)}
.dcg-ds-row.ok{background:#f0fdf4;border-color:var(--g-grass)}
.dcg-ds-row.no{background:#fef2f2;border-color:#fecaca}
.dcg-input{display:flex;gap:.5em;flex-wrap:wrap;margin:.2em 0 .8em}
.dcg-input input{font:700 1.05rem/1 inherit;padding:.6em .8em;border:1px solid var(--g-vien);border-radius:9px;
  width:11em;min-height:var(--nut);color:var(--g-ink)}
.dcg-btn{font:800 .95rem/1 inherit;border:0;border-radius:9px;padding:.72em 1.15em;min-height:var(--nut);
  background:var(--g-deep);color:#fff;cursor:pointer}
.dcg-btn:hover{background:#14532d}
.dcg-btn.ghost{background:#fff;color:var(--g-deep);border:1px solid var(--g-vien)}
.dcg-btn:disabled{opacity:.45;cursor:default}
.dcg-row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.dcg-hint{margin:.6em 0 0;padding:.55em .8em;border-radius:8px;background:#fffbeb;border:1px solid #fde68a;color:var(--g-warn);font-size:.93rem}
.dcg-fb{margin-top:.9em;border-radius:10px;padding:.75em .9em;border:1px solid var(--g-line);background:#f0fdf4}
.dcg-fb.no{background:#fef2f2;border-color:#fecaca}
.dcg-fb h4{margin:0 0 .3em;font-size:1rem;color:var(--g-deep)}
.dcg-fb.no h4{color:var(--g-bad)}
.dcg-fb p{margin:.3em 0;font-size:.95rem}
.dcg-scroll{overflow-x:auto;margin:.6em 0}
.dcg-bbt{border-collapse:collapse;margin:0 auto;font-size:.93rem;text-align:center;background:#fff}
.dcg-bbt th,.dcg-bbt td{border:1px solid var(--g-deep);padding:.3em .75em;white-space:nowrap}
.dcg-bbt th{background:var(--g-mint);width:44px}
.dcg-intro h3{margin:.1em 0 .5em;font-size:1.15rem;color:var(--g-ink)}
.dcg-intro ul{margin:.4em 0 .9em;padding-left:1.2em}
.dcg-intro li{margin:.25em 0}
.dcg-modes{display:grid;gap:.6em;margin:.9em 0}
@media(min-width:560px){.dcg-modes{grid-template-columns:1fr 1fr}}
.dcg-mode{text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;
  border:1px solid var(--g-vien);border-left:4px solid var(--g-grass);border-radius:11px;padding:.8em .9em}
.dcg-mode:hover{background:#f0fdf4}
.dcg-mode b{display:block;font-size:1.02rem;color:var(--g-deep);margin-bottom:.15em}
.dcg-mode span{font-size:.9rem;opacity:.85}
.dcg-cfg{display:grid;gap:.5em;margin:.5em 0}
@media(min-width:560px){.dcg-cfg{grid-template-columns:repeat(2,1fr)}}
.dcg-cfg label{display:flex;gap:.6em;align-items:center;justify-content:space-between;
  border:1px solid var(--g-line);border-radius:8px;padding:.45em .7em;font-size:.92rem;background:#fff}
.dcg-cfg input{font:700 .95rem/1 inherit;width:4.2em;min-height:2.4em;text-align:center;padding:.4em;
  border:1px solid var(--g-vien);border-radius:6px;color:var(--g-ink)}
/* chọn thiết bị và cỡ chữ */
.dcg-tbl{display:grid;gap:.5em;margin:.3em 0 1em}
@media(min-width:560px){.dcg-tbl{grid-template-columns:repeat(3,1fr)}}
.dcg-tb{text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;
  border:1px solid var(--g-vien);border-radius:10px;padding:.55em .7em;min-height:var(--nut)}
.dcg-tb b{display:block;font-size:.98rem;color:var(--g-deep)}
.dcg-tb span{font-size:.82rem;opacity:.85}
.dcg-tb[aria-pressed="true"]{background:var(--g-deep);border-color:var(--g-deep)}
.dcg-tb[aria-pressed="true"] b,.dcg-tb[aria-pressed="true"] span{color:#fff}
.dcg-co{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;margin:.2em 0 1em}
.dcg-co button{font:800 1rem/1 inherit;min-width:var(--nut);min-height:var(--nut);border-radius:8px;
  border:1px solid var(--g-vien);background:#fff;color:var(--g-deep);cursor:pointer}
.dcg-co b{font-variant-numeric:tabular-nums}
.dcg-h4{margin:.9em 0 .35em;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#15803d}
.dcg-h4:first-child{margin-top:0}
.dcg[data-cham="1"] .dcg-opt:hover{background:#fff}
.dcg-grid{display:grid;gap:.6em;margin:.8em 0}
@media(min-width:560px){.dcg-grid{grid-template-columns:repeat(4,1fr)}}
.dcg-stat{border:1px solid var(--g-line);border-radius:10px;padding:.6em .7em;background:#f0fdf4;text-align:center}
.dcg-stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--g-deep)}
.dcg-stat span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.dcg-rank{text-align:center;margin:.6em 0 .2em;font-size:1.25rem;font-weight:800;color:var(--g-deep)}
.dcg-rev{border:1px solid var(--g-line);border-radius:9px;padding:.6em .8em;margin:.5em 0;background:#fff}
.dcg-rev summary{cursor:pointer;font-weight:700;color:var(--g-deep);list-style:none}
.dcg-rev summary::-webkit-details-marker{display:none}
.dcg-rev summary::before{content:"\25b6 ";font-size:.75em}
.dcg-rev[open] summary::before{content:"\25bc "}
.dcg-rev .noi{margin-top:.5em;font-size:.94rem}
.dcg-note{font-size:.88rem;opacity:.8;margin:.5em 0 0}
/* Phân số hiển thị chuẩn (tử trên gạch, mẫu dưới gạch) thay vì viết liền
   kiểu "(mx+9)/(x+m)" rất khó đọc. Không dùng MathJax/KaTeX để khỏi phụ
   thuộc mạng — game này chạy độc lập trong iframe nên phải tự đủ. */
.dcg-ps{display:inline-block;vertical-align:-.42em;text-align:center;
  margin:0 .18em;line-height:1.22;font-size:.95em}
.dcg-ps .tu{display:block;border-bottom:1.4px solid currentColor;padding:0 .2em .04em;white-space:nowrap}
.dcg-ps .mau{display:block;padding:.04em .2em 0;white-space:nowrap}
.dcg-mt{white-space:nowrap}
.dcg *:focus-visible{outline:3px solid #4ade80;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dcg *{transition:none!important;animation:none!important}}
</style>

<div class="dcg-card">
  <div class="dcg-top">
    <div class="dcg-brand">Vượt ải đơn điệu<span>Chương 1 &middot; Bài 1 &middot; Tính đơn điệu của hàm số</span></div>
    <div class="dcg-hud" id="dcg-hud"></div>
  </div>
  <div class="dcg-track"><svg id="dcg-svg" viewBox="0 0 320 56" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="dcg-timebar" id="dcg-timebar"><i></i></div>
  <div class="dcg-body" id="dcg-body"></div>
</div>

<script>
(function(){
  'use strict';

  /* ==================================================================
     KHỐI CẤU HÌNH — giáo viên chỉnh ở đây, không cần đụng phần dưới
     ================================================================== */
  var CAUHINH = {
    soCau: { 1:2, 2:3, 3:3, 4:2 },   // số câu của Ải 1, 2, 3, 4 (đặt 0 để bỏ hẳn một ải)
    mang: 3,                          // số mạng ở chế độ Vượt ải
    vdcSoCau: 6,                      // số câu của chế độ Luyện VDC
    vdcMang: 5,                       // số mạng ở chế độ Luyện VDC
    thoiGian: { NB:45, TH:70, VD:100, VDC:130 },   // giây cho mỗi câu, theo mức độ
    diemGoc:  { NB:100, TH:150, VD:220, VDC:350 }, // điểm gốc mỗi câu
    choPhepTuyChinh: true,            // đặt false để ẩn bảng "Tuỳ chỉnh số câu" của học sinh
    theoThietBi: true                 // true: số câu lấy theo thiết bị bên dưới; false: luôn dùng soCau ở trên
  };

  /* Hồ sơ từng thiết bị: cỡ chữ gốc (px), số cột phương án, chiều cao tối thiểu
     vùng bấm, bề rộng dòng đọc, hệ số thời gian, cảm ứng hay không, số câu gợi ý. */
  var THIETBI = {
    maytinh:   {ten:'Máy tính bàn',  mo:'Màn hình lớn, có bàn phím',   fs:17, cot:2, nut:'2.7em', rong:'68ch', gio:1,    cham:0, soCau:{1:2,2:3,3:3,4:2}, vdcSoCau:6},
    laptop:    {ten:'Laptop',        mo:'Màn hình 13 – 15 inch',       fs:16, cot:2, nut:'2.6em', rong:'64ch', gio:1,    cham:0, soCau:{1:2,2:3,3:3,4:2}, vdcSoCau:6},
    tablet:    {ten:'iPad, máy tính bảng', mo:'Chạm tay, nút to hơn',  fs:18, cot:2, nut:'3em',   rong:'60ch', gio:1.15, cham:1, soCau:{1:2,2:3,3:3,4:2}, vdcSoCau:6},
    dienthoai: {ten:'Điện thoại',    mo:'Một cột, đề ngắn, giờ rộng',  fs:17, cot:1, nut:'3.1em', rong:'100%', gio:1.3,  cham:1, soCau:{1:1,2:2,3:2,4:1}, vdcSoCau:4},
    maychieu:  {ten:'Máy chiếu, TV lớp', mo:'Chữ rất to, giờ gấp 2,5', fs:23, cot:2, nut:'2.7em', rong:'55ch', gio:2.5,  cham:0, soCau:{1:2,2:2,3:2,4:2}, vdcSoCau:5}
  };
  var COCHU=[{h:0.9,t:'Nhỏ'},{h:1,t:'Vừa'},{h:1.12,t:'Lớn'},{h:1.26,t:'Rất lớn'}];
  /* ================================================================== */

  var MI='\u2212', INF='\u221e', R='\u211d', SM='\u2216', PR='\u2032';
  var NI=MI+INF, PIF='+'+INF;

  /* ---------- tiện ích ---------- */
  function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function num(v){return v<0?MI+Math.abs(v):''+v;}
  function iv(a,b){return '('+a+'; '+b+')';}
  function ivn(a,b){return iv(typeof a==='number'?num(a):a, typeof b==='number'?num(b):b);}

  /* đa thức: hệ số theo bậc giảm dần, ví dụ [1,-3,-9,1] -> x³ − 3x² − 9x + 1 */
  function poly(c,v){
    v=v||'x';
    var pw=[],n=c.length-1,s='';
    for(var d=n;d>=0;d--) pw.push(d===0?'':(d===1?v:v+(d===2?'\u00b2':d===3?'\u00b3':'^'+d)));
    for(var i=0;i<c.length;i++){
      var val=c[i]; if(val===0) continue;
      var a=Math.abs(val), body=(a===1&&i<c.length-1)?'':a;
      if(s===''){ s=(val<0?MI:'')+body+pw[i]; }
      else { s+=(val<0?' '+MI+' ':' + ')+body+pw[i]; }
    }
    return s===''?'0':s;
  }
  /* nhân tử (x - r), rút gọn khi r = 0 */
  function fac(r){ return r===0? 'x' : '(x '+(r<0?'+ '+Math.abs(r):MI+' '+r)+')'; }
  function facs(r1,r2){ return r2===0? fac(r2)+fac(r1) : fac(r1)+fac(r2); }
  /* (m - k) dạng chuỗi */
  function bieuThucM(k){ return 'm '+(k<0?'+ '+Math.abs(k):MI+' '+k); }
  function ngoacM(k){ return '('+bieuThucM(k)+')'; }
  /* dấu < trần trong chuỗi HTML sinh ra */
  function safe(h){ return String(h).replace(/<(?![a-zA-Z\/!])/g,'&lt;'); }
  /* phân số hiển thị chuẩn: frac('mx + 9','x + m') -> mx+9 trên, x+m dưới, có gạch ngang */
  function frac(tu,mau){ return '<span class="dcg-ps"><span class="tu">'+tu+'</span><span class="mau">'+mau+'</span></span>'; }
  /* mt = math text: bọc một cụm công thức để nó không bao giờ bị xuống dòng
     giữa chừng (kể cả trên máy tính bàn/laptop/iPad/máy chiếu — những nơi
     bề rộng dòng đọc bị giới hạn theo ký tự nên dễ ngắt ngay giữa công thức
     dài). Nếu công thức dài hơn cả dòng thì tự tràn ra một chút chứ không
     vỡ giữa chừng — vẫn dễ đọc hơn nhiều so với bị cắt lung tung. */
  function mt(s){ return '<span class="dcg-mt">'+s+'</span>'; }

  function mcOpts(correctText, wrongTexts){
    var arr=[{t:correctText,ok:true}];
    for(var i=0;i<wrongTexts.length;i++) arr.push({t:wrongTexts[i],ok:false});
    shuffle(arr);
    var idx=0; for(var j=0;j<arr.length;j++) if(arr[j].ok) idx=j;
    return {options:arr.map(function(o){return o.t;}), correct:idx};
  }
  /* mỗi ý có sẵn một biến thể đúng và một biến thể sai; đảm bảo câu nào cũng có cả Đ lẫn S */
  function chonY(cap){
    var out=cap.map(function(c){ return Math.random()<0.5? {t:c[0],ok:true} : {t:c[1],ok:false}; });
    var d=0,i; for(i=0;i<out.length;i++) if(out[i].ok) d++;
    if(d===0){ i=ri(0,cap.length-1); out[i]={t:cap[i][0],ok:true}; }
    else if(d===cap.length){ i=ri(0,cap.length-1); out[i]={t:cap[i][1],ok:false}; }
    return out;
  }

  /* ---------- BỘ SINH CÂU HỎI ---------- */

  /* 1. Đọc bảng xét dấu đạo hàm (NB) */
  function qBangXetDau(){
    var r=shuffle([-3,-2,-1,1,2,3]).slice(0,3).sort(function(a,b){return a-b;});
    var cur=Math.random()<0.5?'+':MI;
    var flat=Math.random()<0.45?ri(0,2):-1;
    var s=[cur],i,j,k;
    for(i=0;i<3;i++){ if(i!==flat) cur=(cur==='+'?MI:'+'); s.push(cur); }
    var target=Math.random()<0.5?'+':MI;
    if(s.indexOf(target)<0) target=(target==='+'?MI:'+');
    var word=(target==='+')?'đồng biến':'nghịch biến';
    var edge=[NI,num(r[0]),num(r[1]),num(r[2]),PIF];
    var good=[],bad=[];
    for(i=0;i<4;i++) for(j=i;j<4;j++){
      var all=true; for(k=i;k<=j;k++) if(s[k]!==target) all=false;
      (all?good:bad).push({i:i,j:j,t:iv(edge[i],edge[j+1])});
    }
    good.sort(function(a,b){return (b.j-b.i)-(a.j-a.i);});
    var corr=good[0], wr=shuffle(bad).slice(0,3).map(function(o){return o.t;});
    var m=mcOpts(corr.t,wr);
    var maxi=[],st0=0;
    for(i=1;i<=4;i++){ if(i===4||s[i]!==s[st0]){ maxi.push({s:s[st0],t:iv(edge[st0],edge[i])}); st0=i; } }
    var gplus=maxi.filter(function(o){return o.s==='+';}).map(function(o){return o.t;}).join(' và ');
    var gminus=maxi.filter(function(o){return o.s===MI;}).map(function(o){return o.t;}).join(' và ');
    var tbl='<div class="dcg-scroll"><table class="dcg-bbt">'+
      '<tr><th>x</th><td>'+NI+'</td><td></td><td>'+num(r[0])+'</td><td></td><td>'+num(r[1])+'</td><td></td><td>'+num(r[2])+'</td><td></td><td>'+PIF+'</td></tr>'+
      '<tr><th>f'+PR+'(x)</th><td></td><td>'+s[0]+'</td><td>0</td><td>'+s[1]+'</td><td>0</td><td>'+s[2]+'</td><td>0</td><td>'+s[3]+'</td><td></td></tr>'+
      '</table></div>';
    return {level:'NB',type:'mc',
      stem:'<p>Cho hàm số y = f(x) có bảng xét dấu đạo hàm như sau:</p>'+tbl+'<p>Hàm số đã cho <b>'+word+'</b> trên khoảng nào dưới đây?</p>',
      options:m.options,correct:m.correct,

      giai:'<p>'+mt('y'+PR+' = '+frac('m '+MI+' '+a,'(x + m)'+'\u00b2'))+'.</p>'+
        '<p>Điều kiện 1: m '+MI+' '+a+' < 0 '+'\u21d4'+' m < '+a+'.</p>'+
        '<p>Điều kiện 2: '+MI+'m '+'\u2209'+' '+ivn(al,PIF)+' '+'\u21d4'+' '+MI+'m '+'\u2264'+' '+al+' '+'\u21d4'+' m '+'\u2265'+' '+MI+al+'.</p>'+
        '<p>Vậy '+MI+al+' '+'\u2264'+' m < '+a+', có '+(a+al)+' giá trị nguyên.</p>'};
  }

  /* 11. VDC – hệ số bậc ba chứa tham số, phải xét riêng a = 0 */
  function qVdcHeSoA(){
    var k=ri(-3,3), t=ri(1,4), A=ngoacM(k);
    return {level:'VDC',type:'short',answer:t+1,
      stem:'<p>Có bao nhiêu giá trị nguyên của tham số m để hàm số '+mt('y = '+A+'x'+'\u00b3'+' + 3'+A+'x'+'\u00b2'+' + '+(3*t)+'x + 1')+' đồng biến trên '+R+'?</p>',
      hint:'Hệ số bậc ba chứa tham số nên phải <b>xét riêng</b> trường hợp hệ số đó bằng 0 trước khi dùng điều kiện '+'\u0394'+' '+'\u2264'+' 0.',
      giai:'<p>Đặt A = '+bieuThucM(k)+'. Ta có '+mt('y'+PR+' = 3Ax'+'\u00b2'+' + 6Ax + '+(3*t))+'.</p>'+
        '<p>Trường hợp A = 0 (m = '+num(k)+'): y'+PR+' = '+(3*t)+' > 0 nên hàm đồng biến trên '+R+' — <b>nhận</b>.</p>'+
        '<p>Trường hợp A '+'\u2260'+' 0: cần 3A > 0 và '+'\u0394'+PR+' = 9A'+'\u00b2'+' '+MI+' '+(9*t)+'A '+'\u2264'+' 0 '+'\u21d4'+' 0 < A '+'\u2264'+' '+t+'.</p>'+
        '<p>Gộp lại 0 '+'\u2264'+' A '+'\u2264'+' '+t+', tức '+num(k)+' '+'\u2264'+' m '+'\u2264'+' '+num(k+t)+': có '+(t+1)+' giá trị nguyên. Quên trường hợp A = 0 sẽ mất đúng một giá trị.</p>'};
  }

  /* 12. VDC – cô lập tham số trên một khoảng (dạng 6.4) */
  function qVdcCoLap(){
    var al=ri(1,3), b=pick([0,3,6]);
    var G=3*al*al+2*b*al;
    var ham='x'+'\u00b3'+(b?' + '+b+'x'+'\u00b2':'')+' '+MI+' mx + 1';
    var g='3x'+'\u00b2'+(b?' + '+(2*b)+'x':'');
    return {level:'VDC',type:'short',answer:G,
      stem:'<p>Có bao nhiêu giá trị nguyên dương của tham số m để hàm số '+mt('y = '+ham)+' đồng biến trên khoảng '+ivn(al,PIF)+'?</p>',
      hint:'Đưa về y'+PR+' '+'\u2265'+' 0 với mọi x trong khoảng rồi <b>cô lập m</b>: m '+'\u2264'+' g(x) với mọi x '+'\u21d4'+' m '+'\u2264'+' giá trị nhỏ nhất của g trên khoảng đó.',
      giai:'<p>'+mt('y'+PR+' = '+g+' '+MI+' m')+'. Hàm đồng biến trên '+ivn(al,PIF)+' '+'\u21d4'+' m '+'\u2264'+' g(x) = '+g+' với mọi x > '+al+'.</p>'+
        '<p>g là hàm đồng biến trên ['+al+'; '+PIF+') nên cận dưới của g trên khoảng đã cho là g('+al+') = '+G+'. Suy ra m '+'\u2264'+' '+G+'.</p>'+
        '<p>Vậy m nguyên dương thoả mãn là 1, 2, …, '+G+': có '+G+' giá trị.</p>'};
  }

  /* 13. VDC – nhất biến đơn điệu trên mỗi khoảng xác định (dạng 6.2) */
  function qVdcKhoangXD(){
    var k=ri(2,4), k2=k*k;
    return {level:'VDC',type:'short',answer:2*k-1,
      stem:'<p>Có bao nhiêu giá trị nguyên của tham số m để hàm số '+mt('y = '+frac('mx + '+k2,'x + m'))+' nghịch biến trên mỗi khoảng xác định của nó?</p>',
      hint:'Chỉ cần dấu của ad '+MI+' bc. Ở dạng này <b>không có dấu "="</b> vì ad '+MI+' bc = 0 làm hàm trở thành hằng số.',
      giai:'<p>'+mt('y'+PR+' = '+frac('m'+'\u00b2'+' '+MI+' '+k2,'(x + m)'+'\u00b2'))+'.</p>'+
        '<p>Nghịch biến trên mỗi khoảng xác định '+'\u21d4'+' m'+'\u00b2'+' '+MI+' '+k2+' < 0 '+'\u21d4'+' '+MI+k+' < m < '+k+'.</p>'+
        '<p>Các giá trị nguyên: m = '+MI+(k-1)+', …, '+(k-1)+', tất cả '+(2*k-1)+' giá trị. Nếu lấy cả m = '+MI+k+' và m = '+k+' thì hàm là hằng số, không đơn điệu.</p>'};
  }

  /* ---------- kho câu hỏi theo ải ---------- */
  var VDC_POOL=[qVdcBac3,qVdcNhatBien,qVdcHeSoA,qVdcCoLap,qVdcKhoangXD];
  var AI=[
    {no:1,ten:'Đọc dấu',          pool:[qBangXetDau,qLyThuyet,qBangXetDau]},
    {no:2,ten:'Xét dấu đạo hàm',  pool:[qBac3,qNhatBien,qLyThuyet,qBac3]},
    {no:3,ten:'Vận dụng',         pool:[qDSDaoHam,qVanToc,qDSBac3,qLoiNhuan]},
    {no:4,ten:'Tham số m',        pool:VDC_POOL}
  ];

  /* lấy n bộ sinh khác nhau từ pool; nếu n lớn hơn pool thì quay vòng */
  function rutGen(pool,n){
    var out=[],kho=[];
    while(out.length<n){
      if(!kho.length) kho=shuffle(pool.slice());
      out.push(kho.pop());
    }
    return out;
  }
  function taoCauHoi(che){
    var out=[];
    if(che==='vdc'){
      rutGen(VDC_POOL,CAUHINH.vdcSoCau).forEach(function(gen){
        var q=gen(); q.nhan='Luyện VDC'; out.push(q);
      });
      return out;
    }
    AI.forEach(function(a){
      var n=Math.max(0,parseInt(CAUHINH.soCau[a.no],10)||0);
      rutGen(a.pool,n).forEach(function(gen){
        var q=gen(); q.nhan='Ải '+a.no+' \u00b7 '+a.ten; out.push(q);
      });
    });
    return out;
  }
  function tongMacDinh(){
    var s=0; for(var k in CAUHINH.soCau) s+=Math.max(0,parseInt(CAUHINH.soCau[k],10)||0);
    return s;
  }

  /* ---------- thiết bị và cỡ chữ ---------- */
  var root=document.getElementById('dcg-root');
  var TB='laptop', TBHT=THIETBI.laptop, iCoChu=1, tbTuNhan='laptop';

  function doanThietBi(){
    var w=window.innerWidth||1024, tho=false;
    /* pointer: coarse đáng tin hơn 'ontouchstart', vì Chrome trên máy bàn cũng có ontouchstart */
    try{ tho=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches); }catch(e){}
    if(w<600) return 'dienthoai';
    if(tho&&w<1200) return 'tablet';
    if(w>=1500) return 'maytinh';
    return 'laptop';
  }
  function apDungThietBi(k){
    TB=THIETBI[k]?k:'laptop'; TBHT=THIETBI[TB];
    root.setAttribute('data-tb',TB);
    root.setAttribute('data-cham',TBHT.cham?'1':'0');
    root.style.setProperty('--fs',(TBHT.fs*COCHU[iCoChu].h).toFixed(1)+'px');
    root.style.setProperty('--cot',TBHT.cot);
    root.style.setProperty('--nut',TBHT.nut);
    root.style.setProperty('--rong',TBHT.rong);
    if(CAUHINH.theoThietBi){
      for(var i in TBHT.soCau) CAUHINH.soCau[i]=TBHT.soCau[i];
      CAUHINH.vdcSoCau=TBHT.vdcSoCau;
    }
    try{ window.localStorage.setItem('dcg-thietbi',TB); window.localStorage.setItem('dcg-cochu',String(iCoChu)); }catch(e){}
  }

  var body=document.getElementById('dcg-body');
  var hud=document.getElementById('dcg-hud');
  var svg=document.getElementById('dcg-svg');
  var bar=document.getElementById('dcg-timebar');
  var st=null, tick=null, best=0, bestVDC=0;

  try{
    best=parseInt(window.localStorage.getItem('dcg-doncdieu-best'),10)||0;
    bestVDC=parseInt(window.localStorage.getItem('dcg-doncdieu-best-vdc'),10)||0;
  }catch(e){}

  function soCauVan(){ return st? st.qs.length : Math.max(1,tongMacDinh()); }

  function drawTrack(){
    var w=320,mid=30,tong=soCauVan(),step=w/Math.max(1,tong),pts='0,'+mid,y=mid,dots='';
    var arr=st?st.log:[];
    for(var i=0;i<arr.length;i++){
      y+= arr[i].ok? -5 : 5; if(y<8)y=8; if(y>48)y=48;
      var x=(i+1)*step;
      pts+=' '+x.toFixed(1)+','+y.toFixed(1);
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" fill="'+(arr[i].ok?'#16a34a':'#dc2626')+'"/>';
    }
    svg.innerHTML=
      '<line x1="0" y1="'+mid+'" x2="'+w+'" y2="'+mid+'" stroke="#dcfce7" stroke-width="1.5" stroke-dasharray="4 4"/>'+
      '<polyline points="'+pts+'" fill="none" stroke="#166534" stroke-width="2.2" stroke-linejoin="round"/>'+dots;
  }

  function drawHud(){
    if(!st){ hud.innerHTML='<span>Kỉ lục <b>'+best+'</b></span>'+(bestVDC?'<span>VDC <b>'+bestVDC+'</b></span>':''); return; }
    var h=''; for(var i=0;i<st.mangDau;i++) h+= i<st.mang? '\u2665' : '<i>\u2665</i>';
    hud.innerHTML='<span class="dcg-hearts">'+h+'</span>'+
      '<span>Câu <b>'+Math.min(st.i+1,st.qs.length)+'</b>/'+st.qs.length+'</span>'+
      '<span>Điểm <b>'+st.diem+'</b></span>';
  }

  function setBar(pct,low){
    bar.firstElementChild.style.width=Math.max(0,Math.min(100,pct))+'%';
    if(low) bar.classList.add('low'); else bar.classList.remove('low');
  }

  /* ---------- màn hình đầu ---------- */
  function manHinhDau(){
    st=null; drawHud(); drawTrack(); setBar(100,false);
    var cfg='';
    if(CAUHINH.choPhepTuyChinh){
      cfg='<details class="dcg-rev"><summary>Tuỳ chỉnh số câu</summary><div class="noi">'+
        '<div class="dcg-cfg">'+
        AI.map(function(a){
          return '<label>Ải '+a.no+' &middot; '+a.ten+'<input type="number" min="0" max="8" step="1" data-ai="'+a.no+'" value="'+(CAUHINH.soCau[a.no]||0)+'"></label>';
        }).join('')+
        '<label>Chế độ Luyện VDC<input type="number" min="1" max="12" step="1" id="dcg-cfg-vdc" value="'+CAUHINH.vdcSoCau+'"></label>'+
        '<label>Số mạng (Vượt ải)<input type="number" min="1" max="9" step="1" id="dcg-cfg-mang" value="'+CAUHINH.mang+'"></label>'+
        '</div>'+
        '<p class="dcg-note">Đặt 0 để bỏ hẳn một ải. Số câu mặc định đã được đặt theo thiết bị vừa chọn; sửa ở đây chỉ có hiệu lực trong phiên này.</p>'+
        '</div></details>';
    }
    var tbHtml=Object.keys(THIETBI).map(function(k){
      var pr=THIETBI[k];
      return '<button class="dcg-tb" data-tb="'+k+'" aria-pressed="'+(k===TB?'true':'false')+'">'+
        '<b>'+pr.ten+(k===tbTuNhan?' \u00b7 tự nhận':'')+'</b><span>'+pr.mo+'</span></button>';
    }).join('');
    body.innerHTML=
      '<div class="dcg-intro">'+
      '<p class="dcg-h4">Em đang học trên thiết bị nào?</p>'+
      '<div class="dcg-tbl" id="dcg-tbl">'+tbHtml+'</div>'+
      '<p class="dcg-h4">Cỡ chữ</p>'+
      '<div class="dcg-co">'+
        '<button id="dcg-co-tru" aria-label="Giảm cỡ chữ">A'+MI+'</button>'+
        '<b id="dcg-co-nhan">'+COCHU[iCoChu].t+'</b>'+
        '<button id="dcg-co-cong" aria-label="Tăng cỡ chữ">A+</button>'+
        '<span class="dcg-note" style="margin:0">Đề, phương án và lời giải đều đổi theo.</span>'+
      '</div>'+
      '<p class="dcg-h4">Chọn chế độ chơi</p>'+
      '<div class="dcg-modes">'+
        '<button class="dcg-mode" id="dcg-mode-ai"><b>Vượt 4 ải &middot; <span id="dcg-tong">'+tongMacDinh()+'</span> câu</b>'+
        '<span>Đọc bảng xét dấu '+'\u2192'+' xét dấu đạo hàm '+'\u2192'+' vận dụng '+'\u2192'+' tham số m. Đủ mạch bài, hợp cho ôn cả bài.</span></button>'+
        '<button class="dcg-mode" id="dcg-mode-vdc"><b>Luyện riêng VDC &middot; <span id="dcg-tong-vdc">'+CAUHINH.vdcSoCau+'</span> câu</b>'+
        '<span>Chỉ bài toán tham số m: bậc ba trên '+R+', hệ số bậc ba chứa m, cô lập tham số, hàm nhất biến trên khoảng cho trước và trên mỗi khoảng xác định.</span></button>'+
      '</div>'+
      cfg+
      '<p class="dcg-note">Sai hoặc hết giờ thì mất một mạng. Đúng liên tiếp được nhân điểm tối đa x2. Mỗi câu có một gợi ý, dùng gợi ý thì điểm câu đó giảm 40%.'+
      (TBHT.cham?' Chạm vào phương án để chọn.':' Phím tắt: A/B/C/D hoặc 1'+MI+'4, Enter để nộp.')+'</p>'+
      '</div>';

    /* chọn thiết bị */
    document.getElementById('dcg-tbl').addEventListener('click',function(e){
      var b=e.target.closest('.dcg-tb'); if(!b) return;
      apDungThietBi(b.getAttribute('data-tb')); manHinhDau();
    });
    /* cỡ chữ */
    function doiCoChu(d){
      iCoChu=Math.max(0,Math.min(COCHU.length-1,iCoChu+d));
      apDungThietBi(TB); manHinhDau();
    }
    document.getElementById('dcg-co-tru').onclick=function(){doiCoChu(-1);};
    document.getElementById('dcg-co-cong').onclick=function(){doiCoChu(1);};

    var boxes=body.querySelectorAll('.dcg-cfg input');
    function docCauHinh(){
      for(var i=0;i<boxes.length;i++){
        var el=boxes[i], v=parseInt(el.value,10);
        if(el.id==='dcg-cfg-vdc'){ CAUHINH.vdcSoCau=isFinite(v)?Math.max(1,Math.min(12,v)):CAUHINH.vdcSoCau; }
        else if(el.id==='dcg-cfg-mang'){ CAUHINH.mang=isFinite(v)?Math.max(1,Math.min(9,v)):CAUHINH.mang; }
        else { CAUHINH.soCau[el.getAttribute('data-ai')]=isFinite(v)?Math.max(0,Math.min(8,v)):0; }
      }
    }
    for(var i=0;i<boxes.length;i++) boxes[i].addEventListener('change',function(){
      docCauHinh();
      var t=document.getElementById('dcg-tong'), tv=document.getElementById('dcg-tong-vdc');
      if(t) t.textContent=tongMacDinh();
      if(tv) tv.textContent=CAUHINH.vdcSoCau;
      drawTrack();
    });
    document.getElementById('dcg-mode-ai').onclick=function(){
      docCauHinh();
      if(tongMacDinh()<1){ alert('Cần ít nhất 1 câu. Hãy tăng số câu của một ải.'); return; }
      batDau('ai');
    };
    document.getElementById('dcg-mode-vdc').onclick=function(){ docCauHinh(); batDau('vdc'); };
  }

  function batDau(che){
    var mang=(che==='vdc')?CAUHINH.vdcMang:CAUHINH.mang;
    st={che:che,qs:taoCauHoi(che),i:0,diem:0,mang:mang,mangDau:mang,streak:0,dung:0,log:[],batDauLuc:Date.now()};
    drawHud(); drawTrack(); veCau();
  }
  function choiLai(){ batDau(st?st.che:'ai'); }

  function dungTimer(){ if(tick){clearInterval(tick);tick=null;} }

  function veCau(){
    var q=st.qs[st.i];
    st.daTraLoi=false; st.daGoiY=false; st.ds=[null,null,null,null];
    var head='<div class="dcg-meta"><span class="dcg-tag ai">'+q.nhan+'</span><span class="dcg-tag">'+q.level+'</span>'+
      (st.streak>1?'<span class="dcg-tag">Chuỗi '+st.streak+' &middot; x'+(1+0.15*st.streak).toFixed(2)+'</span>':'')+'</div>';
    var main='<div class="dcg-stem">'+safe(q.stem)+'</div>';
    var ctrl='';
    if(q.type==='mc'){
      var kb=['A','B','C','D'];
      ctrl='<div class="dcg-opts" id="dcg-opts">';
      for(var i=0;i<q.options.length;i++)
        ctrl+='<button class="dcg-opt" data-i="'+i+'"><kbd>'+kb[i]+'</kbd><span>'+safe(q.options[i])+'</span></button>';
      ctrl+='</div>';
    } else if(q.type==='ds'){
      var kk=['a','b','c','d'];
      ctrl='<div class="dcg-ds" id="dcg-ds">';
      for(var j=0;j<q.items.length;j++)
        ctrl+='<div class="dcg-ds-row" data-j="'+j+'"><span class="k">'+kk[j]+')</span><span class="t">'+safe(q.items[j].t)+'</span>'+
          '<span class="btns"><button data-v="1" aria-pressed="false" aria-label="Đúng">Đ</button>'+
          '<button data-v="0" aria-pressed="false" aria-label="Sai">S</button></span></div>';
      ctrl+='</div><div class="dcg-row"><button class="dcg-btn" id="dcg-nop" disabled>Nộp đáp án</button></div>';
    } else {
      ctrl='<div class="dcg-input"><input id="dcg-in" type="text" inputmode="numeric" autocomplete="off" placeholder="Nhập một số">'+
        '<button class="dcg-btn" id="dcg-nop">Nộp đáp án</button></div>';
    }
    body.innerHTML=head+main+ctrl+
      '<div class="dcg-row" style="margin-top:.7em"><button class="dcg-btn ghost" id="dcg-goiy">Xem gợi ý ('+MI+'40% điểm)</button></div>'+
      '<div id="dcg-hintbox"></div><div id="dcg-fb" aria-live="polite"></div>';
    drawHud();

    document.getElementById('dcg-goiy').onclick=function(){
      st.daGoiY=true; this.disabled=true;
      document.getElementById('dcg-hintbox').innerHTML='<div class="dcg-hint">'+safe(q.hint)+'</div>';
    };
    if(q.type==='mc'){
      document.getElementById('dcg-opts').addEventListener('click',function(e){
        var b=e.target.closest('.dcg-opt'); if(!b||st.daTraLoi) return;
        chamMC(parseInt(b.getAttribute('data-i'),10));
      });
    } else if(q.type==='ds'){
      document.getElementById('dcg-ds').addEventListener('click',function(e){
        var b=e.target.closest('button'); if(!b||st.daTraLoi) return;
        var row=b.closest('.dcg-ds-row'), j=parseInt(row.getAttribute('data-j'),10);
        st.ds[j]=b.getAttribute('data-v')==='1';
        var bs=row.querySelectorAll('button');
        bs[0].setAttribute('aria-pressed', st.ds[j]?'true':'false');
        bs[1].setAttribute('aria-pressed', st.ds[j]?'false':'true');
        document.getElementById('dcg-nop').disabled = st.ds.indexOf(null)>=0;
      });
      document.getElementById('dcg-nop').onclick=function(){ if(!st.daTraLoi) chamDS(); };
    } else {
      var inp=document.getElementById('dcg-in');
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!st.daTraLoi) chamShort(); });
      document.getElementById('dcg-nop').onclick=function(){ if(!st.daTraLoi) chamShort(); };
      inp.focus();
    }

    var tong=Math.round(CAUHINH.thoiGian[q.level]*(TBHT.gio||1)), conLai=tong;
    setBar(100,false);
    dungTimer();
    tick=setInterval(function(){
      conLai-=0.2;
      setBar(conLai/tong*100, conLai<=tong*0.2);
      if(conLai<=0){ dungTimer(); if(!st.daTraLoi) hetGio(); }
    },200);
    st.conLai=function(){return conLai;}; st.tong=tong;
  }

  function diemCau(q,ratio,heSoThoiGian){
    var base=CAUHINH.diemGoc[q.level];
    var d=base*ratio + base*0.3*ratio*heSoThoiGian;
    if(st.daGoiY) d*=0.6;
    d*= Math.min(2,1+0.15*st.streak);
    return Math.round(d);
  }

  function ketThucCau(q,ok,ratio,khoiSai,matMang){
    if(matMang===undefined) matMang=!ok;
    dungTimer(); st.daTraLoi=true;
    var hs=Math.max(0,st.conLai())/st.tong;
    var duoc=ratio>0? diemCau(q,ratio,hs) : 0;
    if(ok) st.streak++; else if(matMang) st.streak=0;
    if(ok) st.dung++;
    st.diem+=duoc;
    if(matMang) st.mang--;
    st.log.push({ok:ok,q:q,duoc:duoc,khoiSai:khoiSai||''});
    drawHud(); drawTrack();
    var het=(st.mang<=0)||(st.i+1>=st.qs.length);
    var fb=document.getElementById('dcg-fb');
    fb.className='dcg-fb'+(ok?'':' no');
    fb.innerHTML='<h4>'+(ok?'Chính xác. +'+duoc+' điểm':(duoc>0?'Chưa trọn vẹn. +'+duoc+' điểm':'Chưa đúng.'))+'</h4>'+
      (khoiSai?'<p>'+safe(khoiSai)+'</p>':'')+safe(q.giai)+
      '<div class="dcg-row" style="margin-top:.6em"><button class="dcg-btn" id="dcg-next">'+(het?'Xem kết quả':'Câu tiếp theo')+'</button></div>';
    var nx=document.getElementById('dcg-next');
    nx.onclick=function(){ if(het){ ketQua(); return; } st.i++; veCau(); };
    nx.focus();
  }

  function chamMC(i){
    var q=st.qs[st.i], ok=(i===q.correct);
    var btns=document.querySelectorAll('#dcg-opts .dcg-opt');
    for(var k=0;k<btns.length;k++){
      btns[k].disabled=true;
      if(k===q.correct) btns[k].classList.add('ok');
      else if(k===i) btns[k].classList.add('no');
    }
    ketThucCau(q,ok,ok?1:0, ok?'':'Đáp án đúng: <b>'+safe(q.options[q.correct])+'</b>.');
  }

  function chamDS(){
    var q=st.qs[st.i], dung=0, kk=['a','b','c','d'], sai=[];
    var rows=document.querySelectorAll('#dcg-ds .dcg-ds-row');
    for(var j=0;j<q.items.length;j++){
      var d=(st.ds[j]===q.items[j].ok);
      if(d) dung++; else sai.push(kk[j]);
      rows[j].classList.add(d?'ok':'no');
      rows[j].querySelector('.btns').innerHTML='<b style="color:'+(d?'#166534':'#b91c1c')+'">'+(q.items[j].ok?'Đ':'S')+'</b>';
    }
    var ratio=[0,0.1,0.25,0.5,1][dung];
    var note='Đúng '+dung+'/4 ý'+(sai.length?'; sai ở ý '+sai.join(', '):'')+'.';
    /* đúng từ 3 ý trở lên thì không mất mạng */
    ketThucCau(q,dung===4,ratio,note,dung<3);
  }

  function chamShort(){
    var q=st.qs[st.i];
    var raw=(document.getElementById('dcg-in').value||'').trim().replace(',','.');
    var v=parseFloat(raw);
    var ok=isFinite(v)&&Math.abs(v-q.answer)<1e-9;
    document.getElementById('dcg-in').disabled=true;
    document.getElementById('dcg-nop').disabled=true;
    ketThucCau(q,ok,ok?1:0, ok?'':'Đáp án đúng: <b>'+q.answer+'</b>.');
  }

  function hetGio(){
    var q=st.qs[st.i];
    if(q.type==='mc'){
      var btns=document.querySelectorAll('#dcg-opts .dcg-opt');
      for(var k=0;k<btns.length;k++){ btns[k].disabled=true; if(k===q.correct) btns[k].classList.add('ok'); }
    } else if(q.type==='ds'){
      var rows=document.querySelectorAll('#dcg-ds .dcg-ds-row');
      for(var j=0;j<q.items.length;j++) rows[j].querySelector('.btns').innerHTML='<b style="color:#166534">'+(q.items[j].ok?'Đ':'S')+'</b>';
      document.getElementById('dcg-nop').disabled=true;
    } else {
      document.getElementById('dcg-in').disabled=true;
      document.getElementById('dcg-nop').disabled=true;
    }
    ketThucCau(q,false,0,'Hết giờ. '+(q.type==='short'?'Đáp án đúng: <b>'+q.answer+'</b>.':(q.type==='mc'?'Đáp án đúng: <b>'+safe(q.options[q.correct])+'</b>.':'')));
  }

  function xepHang(){
    var n=st.qs.length, tl=st.dung/n;
    if(st.che==='vdc'){
      if(tl===1) return 'Trùm tham số m';
      if(tl>=0.8) return 'Rất chắc dạng VDC';
      if(tl>=0.5) return 'Đã nắm ý chính, còn sót điều kiện';
      return 'Cần ôn lại điều kiện của từng dạng';
    }
    if(st.mang<=0&&tl<0.6) return 'Cần luyện thêm phần xét dấu';
    if(tl===1) return 'Đỉnh Cao Trí Tuệ';
    if(st.dung>=n-1) return 'Cao thủ đơn điệu';
    if(tl>=0.7) return 'Vững nền tảng';
    if(tl>=0.5) return 'Đang tiến bộ';
    return 'Tân binh';
  }

  function ketQua(){
    dungTimer(); setBar(0,false);
    var n=st.qs.length;
    var giay=Math.round((Date.now()-st.batDauLuc)/1000);
    var phut=Math.floor(giay/60), gd=giay%60;
    var khoa=(st.che==='vdc')?'dcg-doncdieu-best-vdc':'dcg-doncdieu-best';
    if(st.che==='vdc'){ if(st.diem>bestVDC){ bestVDC=st.diem; try{window.localStorage.setItem(khoa,String(bestVDC));}catch(e){} } }
    else { if(st.diem>best){ best=st.diem; try{window.localStorage.setItem(khoa,String(best));}catch(e){} } }
    var kl=(st.che==='vdc')?bestVDC:best;
    var sai=st.log.filter(function(l){return !l.ok;});
    var h='<div class="dcg-rank">'+xepHang()+'</div>'+
      '<div class="dcg-grid">'+
      '<div class="dcg-stat"><b>'+st.diem+'</b><span>Điểm</span></div>'+
      '<div class="dcg-stat"><b>'+st.dung+'/'+n+'</b><span>Câu đúng</span></div>'+
      '<div class="dcg-stat"><b>'+st.mang+'</b><span>Mạng còn</span></div>'+
      '<div class="dcg-stat"><b>'+phut+'\''+(gd<10?'0':'')+gd+'</b><span>Thời gian</span></div>'+
      '</div>';
    if(st.mang<=0) h+='<p>Hết mạng ở câu '+(st.i+1)+'. Ván sau nhớ đọc kĩ dấu của đạo hàm trước khi chọn.</p>';
    if(sai.length){
      h+='<h3 style="font-size:1.05rem;margin:1em 0 .3em">Ôn lại '+sai.length+' câu chưa đúng</h3>';
      sai.forEach(function(l,k){
        h+='<details class="dcg-rev"><summary>Câu chưa đúng '+(k+1)+' &middot; '+l.q.nhan+' &middot; '+l.q.level+'</summary>'+
           '<div class="noi">'+safe(l.q.stem)+(l.khoiSai?'<p>'+safe(l.khoiSai)+'</p>':'')+safe(l.q.giai)+'</div></details>';
      });
    } else {
      h+='<p>Toàn bộ '+n+' câu đều đúng. Thử lại ở tốc độ nhanh hơn để lấy thêm điểm thưởng thời gian.</p>';
    }
    h+='<div class="dcg-row" style="margin-top:.9em"><button class="dcg-btn" id="dcg-again">Chơi lại chế độ này</button>'+
       '<button class="dcg-btn ghost" id="dcg-home">Đổi chế độ</button>'+
       '<span style="font-size:.9rem;opacity:.8">Kỉ lục'+(st.che==='vdc'?' VDC':'')+': <b>'+kl+'</b></span></div>';
    body.innerHTML=h;
    document.getElementById('dcg-again').onclick=choiLai;
    document.getElementById('dcg-home').onclick=manHinhDau;
    hud.innerHTML='<span>Đã xong '+st.dung+'/'+n+'</span><span>Điểm <b>'+st.diem+'</b></span><span>Kỉ lục <b>'+kl+'</b></span>';
  }

  /* phím tắt A/B/C/D và 1–4 cho câu trắc nghiệm */
  document.addEventListener('keydown',function(e){
    if(!st||st.daTraLoi) return;
    var q=st.qs[st.i]; if(!q||q.type!=='mc') return;
    var map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
    var k=String(e.key||'').toLowerCase();
    if(map[k]!==undefined && document.getElementById('dcg-opts')) chamMC(map[k]);
  });

  if(body){
    tbTuNhan=doanThietBi();
    var tbLuu=null, coLuu=null;
    try{ tbLuu=window.localStorage.getItem('dcg-thietbi'); coLuu=window.localStorage.getItem('dcg-cochu'); }catch(e){}
    if(coLuu!==null){ var ci=parseInt(coLuu,10); if(isFinite(ci)&&COCHU[ci]) iCoChu=ci; }
    apDungThietBi(THIETBI[tbLuu]?tbLuu:tbTuNhan);
    manHinhDau();
  }
})();
</script>
</div>

<script>
/* báo chiều cao cho trang cha để iframe tự co giãn */
(function(){
  function baoCao(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height)+16;
    try{ parent.postMessage({type:'dcg-height', id:'dondieu-1-1', height:h}, '*'); }catch(e){}
  }
  window.addEventListener('load',baoCao);
  if(window.ResizeObserver){ new ResizeObserver(baoCao).observe(document.body); }
  else { setInterval(baoCao,600); }
})();
</script>
</body>
